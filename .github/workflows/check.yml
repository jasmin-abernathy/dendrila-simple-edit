name: PHP quick checks
on:
  push:
    branches: [main]
    paths:
      - '**.php'
      - '**.js'
      - '.github/workflows/check.yml'
  pull_request:
    paths:
      - '**.php'
      - '**.js'
      - '.github/workflows/check.yml'
permissions:
  contents: read
concurrency:
  group: dse-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Check PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run contract tests
        run: |
          php tests/smoke.php
          php tests/builders-acf.php
          php tests/gutenberg-text.php
          php tests/suppressions-sql.php
          php tests/consent-input.php
          php tests/media.php
          php tests/modules-newsletters.php
          php tests/modules-woo.php
          php tests/content-type-scopes.php
          php tests/relais-regressions.php
          php tests/first-install.php
          php tests/admin-settings.php
          php tests/navigation-subgroups.php
          php tests/navigation-subgroups.php missing-confirmation
          php tests/navigation-subgroups.php convert
          node tests/navigation-drag.js
          node tests/navigation-mobile.js
          node tests/admin-actions.js
  integration:
    name: WordPress plugin access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: dse-integration-only
          MARIADB_DATABASE: dse_access_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -pdse-integration-only"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          tools: wp-cli
          coverage: none
      - name: Set isolated integration paths
        shell: bash
        run: |
          printf 'DSE_WP_ROOT=%s/dse-wordpress\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'DSE_TEST_OUTPUT=%s/dse-plugin-access-results\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Prepare disposable WordPress
        shell: bash
        run: |
          set -euo pipefail
          wp core download --path="$DSE_WP_ROOT" --version=7.1.5 --skip-content
          wp config create --path="$DSE_WP_ROOT" --dbname=dse_access_test --dbuser=root --dbpass=dse-integration-only --dbhost=127.0.0.1
          wp config set DISABLE_WP_CRON true --raw --path="$DSE_WP_ROOT"
          wp config set AUTOMATIC_UPDATER_DISABLED true --raw --path="$DSE_WP_ROOT"
          wp core install --path="$DSE_WP_ROOT" --url=http://127.0.0.1:8098 --title="Plugin access tests" --admin_user=bootstrap --admin_password="$(openssl rand -hex 24)" --admin_email=fixture@example.invalid --skip-email
          mkdir -p "$DSE_WP_ROOT/wp-content/plugins"
          ln -s "$GITHUB_WORKSPACE" "$DSE_WP_ROOT/wp-content/plugins/dendrila-simple-edit"
          DSE_PLUGIN_ACCESS_ALLOW_INSTALL=1 php tests/plugin-access/install-fixtures.php
      - name: Verify plugin permission boundaries and native forms
        run: |
          php tests/plugin-access/integration.php
          php tests/plugin-access/http-integration.php
          php tests/plugin-access/mailing-sql-integration.php
          php tests/plugin-access/gutenberg-integration.php
  package:
    name: Installation ZIP
    needs: [php, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Assemble installable extension
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/dendrila-simple-edit
          cp dendrila-simple-edit.php readme.txt LICENSE.txt dist/dendrila-simple-edit/
          cp -R includes assets languages dist/dendrila-simple-edit/
          (cd dist && zip -qr ../dendrila-simple-edit-0.0.2.zip dendrila-simple-edit)
          unzip -t dendrila-simple-edit-0.0.2.zip
          test "$(unzip -Z1 dendrila-simple-edit-0.0.2.zip | grep -c '^dendrila-simple-edit/dendrila-simple-edit.php$')" -eq 1
          if unzip -Z1 dendrila-simple-edit-0.0.2.zip | grep -E '(^|/)(tests|docs|\.git|\.github)/'; then
            echo 'Unexpected development files in the installable archive' >&2
            exit 1
          fi
      - name: Attach installable archive
        uses: actions/upload-artifact@v4
        with:
          name: dendrila-simple-edit-installation
          path: dendrila-simple-edit-0.0.2.zip
          if-no-files-found: error
          retention-days: 14
